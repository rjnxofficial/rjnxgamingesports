name: Android App

# Builds a real release APK + AAB with the Android SDK and Gradle.
# Production signing is used when the keystore secrets exist; otherwise the
# build is signed with the Expo debug keystore so QA can still install it.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Optional EAS profile (leave empty to build locally with Gradle)"
        required: false
        default: ""
        type: choice
        options: ["", "preview", "production-apk", "production"]
      smoke_only:
        description: "Skip the Gradle build and smoke-test the newest successful APK artifact"
        required: false
        default: false
        type: boolean

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  EXPO_METRO_MAX_WORKERS: "4"

jobs:
  quality:
    name: Typecheck · bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @rjnx/mobile

      # Guards the crash class that only appears on a device: expo-router treats
      # a route-local binding named ErrorBoundary as its own route boundary.
      - name: Route module check
        run: npm run verify:routes --workspace @rjnx/mobile

      - name: Metro bundle check
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
          EXPO_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rjnxgamingesports.com' }}
        run: npx expo export --platform android --output-dir /tmp/expo-bundle --clear
        working-directory: apps/mobile

  build:
    name: Release APK + AAB
    needs: quality
    if: github.event.inputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rjnxgamingesports.com' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No `cache: gradle` here: the Android project (and therefore every
      # Gradle file) is generated by `expo prebuild` further down, so setup-java
      # would fail with "No file matched to [**/*.gradle*]". The Gradle cache is
      # restored explicitly by the next step instead.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/mobile/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            gradle-${{ runner.os }}-

      # The ubuntu runner image ships a complete Android SDK, but the variable
      # that points at it and the sdkmanager location differ between image
      # versions. Resolve both defensively instead of assuming env vars exist.
      - name: Resolve Android SDK location
        run: |
          set -uo pipefail
          candidates=(
            "${ANDROID_SDK_ROOT:-}"
            "${ANDROID_HOME:-}"
            "$HOME/android-sdk"
            "$HOME/Android/Sdk"
            "/usr/local/lib/android/sdk"
            "/opt/android-sdk"
          )
          SDK=""
          for candidate in "${candidates[@]}"; do
            if [ -n "$candidate" ] && [ -d "$candidate/platforms" ]; then SDK="$candidate"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::No Android SDK found on this runner. Looked in: ${candidates[*]}"
            ls -la "$HOME" || true
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -maxdepth 4 -type f -name sdkmanager -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK"
            find "$SDK" -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "SDK=$SDK"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          java -version
          ls "$SDK"

      - run: npm ci

      - name: Expo prebuild (Android project)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install

      # Install exactly the platform / build-tools / NDK the generated project
      # needs. The requirements come from the React Native version catalog that
      # Expo wires into Gradle, so they never drift from the build. sdkmanager
      # ships with the runner image, so no third-party SDK action is involved.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          mapfile -t packages < <(node apps/mobile/scripts/android-sdk-requirements.mjs --print-packages)
          echo "required: ${packages[*]}"
          "$SDKMANAGER" --list_installed | sed -n '1,25p'
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          missing=()
          while IFS= read -r pkg; do
            if grep -qF "$pkg" <<< "$("$SDKMANAGER" --list_installed)"; then
              echo "already installed: $pkg"
            else
              missing+=("$pkg")
            fi
          done < <(printf '%s\n' "${packages[@]}")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "installing: ${missing[*]}"
            "$SDKMANAGER" "${missing[@]}"
          fi

      - name: Verify Android SDK
        run: node apps/mobile/scripts/android-sdk-requirements.mjs --check

      - name: Configure signing (production key, or debug fallback)
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-android-signing.mjs
          node scripts/verify-android-project.mjs
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify build outputs
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          test -n "$(ls app/build/outputs/apk/release/*.apk 2>/dev/null)" || { echo "::error::APK not produced"; exit 1; }
          test -n "$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null)" || { echo "::error::AAB not produced"; exit 1; }

      - name: Name artifacts
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          # cwd is apps/mobile/android, so the app manifest lives one level up.
          VERSION=$(node -p "require('../package.json').version")
          echo "version=$VERSION mode=$SIGNING_MODE"
          mkdir -p /tmp/rjnx-out
          cp app/build/outputs/apk/release/*.apk "/tmp/rjnx-out/rjnx-esports-${VERSION}-${SIGNING_MODE}.apk"
          cp app/build/outputs/bundle/release/*.aab "/tmp/rjnx-out/rjnx-esports-${VERSION}-${SIGNING_MODE}.aab"
          ls -lh /tmp/rjnx-out
          {
            echo "### Android build"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Signing | ${SIGNING_MODE} |"
            echo "| Version | ${VERSION} |"
            echo "| APK | $(basename /tmp/rjnx-out/*.apk) |"
            echo "| AAB | $(basename /tmp/rjnx-out/*.aab) |"
            echo
            echo "Download both files from the run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: rjnx-esports-apk
          path: /tmp/rjnx-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: rjnx-esports-aab
          path: /tmp/rjnx-out/*.aab
          if-no-files-found: error
          retention-days: 30

  # Reproduces the app start on a real Android runtime. A successful Gradle build
  # says nothing about whether the JS bundle boots, so this job installs the APK
  # on an emulator, cold-starts it, and fails with the actual FATAL EXCEPTION
  # from logcat when the process dies. It always publishes the log to the step
  # summary and the PR comment, so the crash reason is readable without
  # downloading artifacts.
  smoke:
    name: Startup smoke test (emulator)
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.smoke_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the APK artifact from the build job / earlier run
      pull-requests: write
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rjnxgamingesports.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # "configured" proves the real build boots; "unconfigured" proves the
          # app degrades to its configuration screen instead of crashing. Both
          # APKs come from the same build, only the assertion differs, so the
          # matrix documents the expected behaviour rather than the env.
          - label: configured
            mode: configured
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm unavailable — emulator will run without acceleration"

      - name: Download the built APK
        uses: actions/download-artifact@v7
        if: needs.build.result == 'success'
        with:
          name: rjnx-esports-apk
          path: /tmp/rjnx-apk

      # smoke_only runs reuse the newest successful APK so a logcat iteration
      # takes minutes instead of rebuilding Gradle from scratch.
      - name: Download the newest successful APK (smoke_only)
        if: needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --status success --limit 20 \
            --json databaseId,headBranch --jq --arg branch "$GITHUB_REF_NAME" '[.[] | select(.headBranch == $branch)][0].databaseId')
          echo "reusing artifacts from run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n rjnx-esports-apk -D /tmp/rjnx-apk
          find /tmp/rjnx-apk -type f | head

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_MODE: ${{ matrix.mode }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          # The action runs this with /usr/bin/sh; the wrapper is POSIX-only.
          script: sh apps/mobile/scripts/smoke-emulator-entry.sh

      - name: Publish logcat summary
        if: always()
        run: |
          {
            echo "### Startup smoke test (${{ matrix.mode }})"
            echo
            echo '```'
            cat /tmp/rjnx-smoke/report.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- crash slice ----"
          cat /tmp/rjnx-smoke/crash-slice.txt 2>/dev/null || true

      - name: Comment the crash log on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          body=$(printf '### Android startup smoke (%s)\n\n```\n%s\n```\n' \
            "${{ matrix.mode }}" \
            "$(tail -c 55000 /tmp/rjnx-smoke/crash-slice.txt 2>/dev/null || echo 'no log captured')")
          gh pr comment "$PR" --body "$body" || echo "::warning::could not comment on the PR"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rjnx-startup-logcat-${{ matrix.mode }}
          path: /tmp/rjnx-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  eas-build:
    name: EAS build (${{ github.event.inputs.profile }})
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile != ''
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: eas build --platform android --profile "${{ github.event.inputs.profile }}" --non-interactive --no-wait
