name: Website CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared package
        run: npm run typecheck --workspace @rjnx/shared

      - name: Unit tests (scoring engine, validation)
        run: npm test --workspace @rjnx/shared

      - name: Typecheck website
        run: npm run typecheck --workspace @rjnx/web

      - name: Lint website
        run: npm run lint --workspace @rjnx/web

      - name: Verify Supabase schema (static)
        run: node apps/web/scripts/verify-supabase.mjs

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://rjnxgamingesports.com' }}
        run: npm run build --workspace @rjnx/web

      - name: Backend status (live Supabase probe)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
        run: |
          set -uo pipefail
          output=$(node apps/web/scripts/db-status.mjs 2>&1) && status=0 || status=$?
          echo "$output"
          {
            echo "### Backend status"
            echo
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Supabase backend is not fully reachable (see the Backend status section in the run summary)."
          fi

      - name: Smoke test the production server
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://nuckewrlcjphjmnfgilo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_bj2iYWHvILa6__h5bZrsmA_F2CPG1gj' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          ( cd apps/web && npx next start -p 3111 ) &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3111/api/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          if node apps/web/scripts/smoke.mjs http://127.0.0.1:3111; then
            echo "smoke: full pass (database reachable)"
          else
            echo "::error::smoke test failed"
            node apps/web/scripts/smoke.mjs http://127.0.0.1:3111 --allow-degraded-db || true
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: website-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          # `.next` is a dot-directory; without this flag the uploader finds no
          # files and the step fails with if-no-files-found: error.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  deploy-vercel:
    name: Deploy to Vercel
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check Vercel secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials found — production deploy will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Website deployment skipped"
              echo
              echo "Vercel credentials are not configured, so nothing was deployed."
              echo "Add these repository secrets to enable automatic production deploys:"
              echo
              echo "- \`VERCEL_TOKEN\` — https://vercel.com/account/tokens"
              echo "- \`VERCEL_ORG_ID\` — from \`.vercel/project.json\` after \`vercel link\`"
              echo "- \`VERCEL_PROJECT_ID\` — from the same file"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Vercel secrets missing — deploy skipped (not a failure)."
          fi

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Deploy to Vercel (production)
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --cwd .)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          {
            echo "### Website deployment"
            echo
            echo "- Production URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployed health endpoint
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if body=$(curl -fsS "$DEPLOY_URL/api/health"); then
              echo "$body"
              echo "$body" | grep -q '"service":"rjnx-web"' || { echo "::error::health endpoint did not identify as rjnx-web"; exit 1; }
              if echo "$body" | grep -q '"status":"ok"'; then
                echo "Database reachable — deployment healthy."
              else
                echo "::warning::Site is deployed but reports a degraded database. Configure SUPABASE_SERVICE_ROLE_KEY / NEXT_PUBLIC_SUPABASE_* in the Vercel project settings."
              fi
              exit 0
            fi
            sleep 6
          done
          echo "::error::$DEPLOY_URL/api/health did not respond after 60s"
          exit 1
