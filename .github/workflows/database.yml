name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/database.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Also run seed.sql"
        type: boolean
        default: false

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations (rjnx schema)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect target database (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        id: inspect
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret missing — skipping inspection and migration."
            exit 0
          fi
          npm run db:check --workspace @rjnx/web

      - name: Apply migrations
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:push --workspace @rjnx/web

      - name: Seed reference data
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node apps/web/scripts/db-setup.mjs --with-seed
